apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: wordpress-deploy
  name: wordpress-deploy
spec:
  replicas: {{ .Values.wordpress.replicas }}
  selector:
    matchLabels:
      app: wordpress-deploy
  template:
    metadata:
      labels:
        app: wordpress-deploy
    spec:
      containers:
      - image: {{ .Values.wordpress.image }}
        imagePullPolicy: {{ .Values.wordpress.imagePullPolicy }}
        name: wordpress
        ports:
        - containerPort: 80
        env:
        - name: WORDPRESS_DB_HOST
          value: mysql-deploy
        - name: WORDPRESS_DB_USER
          value: {{ .Values.mysql.secret.user | quote }}
        - name: WORDPRESS_DB_PASSWORD
          value: {{ .Values.mysql.secret.password | quote }}
        - name: WORDPRESS_DB_NAME
          value: {{ .Values.mysql.secret.database | quote }}
