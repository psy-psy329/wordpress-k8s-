{{- if .Values.wordpress.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-ingress
spec:
  ingressClassName: {{ .Values.wordpress.ingress.className | quote }}
  rules:
  - host: {{ .Values.wordpress.ingress.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wordpress-deploy
            port:
              number: {{ .Values.wordpress.service.port }}
{{- end }}
