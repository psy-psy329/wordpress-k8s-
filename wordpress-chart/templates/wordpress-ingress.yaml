apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-ingress
spec:
  ingressClassName: {{ .Values.wordpress.ingress.className }}
  rules:
  - host: {{ .Values.wordpress.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wordpress-deploy
            port:
              number: {{ .Values.wordpress.service.port }}
